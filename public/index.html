<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Recito</title>
<style>
  :root { --bg:#0e1014; --card:#181b22; --line:#272b35; --text:#eef0f4; --dim:#8b91a0; --accent:#7ce0b0; --danger:#ff7a7a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
         padding:max(16px,env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom)); max-width:640px; margin-inline:auto; }
  h1 { font-size:18px; margin:4px 0 14px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .drop { display:flex; align-items:center; justify-content:center; gap:10px; min-height:84px; border:1.5px dashed var(--line);
          border-radius:16px; background:var(--card); color:var(--dim); font-weight:600; cursor:pointer; }
  .drop:active { border-color:var(--accent); color:var(--text); }
  input[type=file] { display:none; }
  #thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .thumb { position:relative; width:76px; height:76px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button { position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%; border:0; background:#000a; color:#fff; font-size:14px; line-height:1; }
  #status { margin:14px 2px 6px; color:var(--dim); font-size:14px; min-height:20px; }
  #status.err { color:var(--danger); }
  ol { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  li small { display:block; color:var(--dim); font-size:12.5px; }
  li b { color:var(--accent); font-weight:600; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
         background:linear-gradient(transparent,var(--bg) 28%); display:flex; gap:10px; align-items:center; justify-content:center; }
  #play { flex:1; max-width:608px; height:64px; border:0; border-radius:20px; background:var(--accent); color:#06281a; font-size:19px; font-weight:700; }
  #play.on { background:var(--danger); color:#2b0606; }
  #play:disabled { opacity:.4; }
</style>
</head>
<body>
<h1>Reci<span>to</span></h1>

<label class="drop" for="file">＋ Add question photos</label>
<input id="file" type="file" accept="image/*" multiple>
<div id="thumbs"></div>
<div id="status">Add photos, then press Play.</div>
<ol id="list"></ol>

<div class="bar">
  <button id="play" disabled>▶ Play</button>
</div>
<audio id="audio" playsinline preload="auto"></audio>

<script>
const $ = (id) => document.getElementById(id);
const audio = $("audio"), playBtn = $("play"), statusEl = $("status");
let images = [];          // [{b64, url}]
let answers = null;       // solved answers for current images
let audioUrl = null;      // one joined, loopable file for the current answers
let playing = false, version = 0, prep = null, timer = 0;
const RATE = 0.6;         // fixed playback speed
const GAP = 1;            // seconds of silence heard after each answer

const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? "err" : ""; };

// Half a second of silence. Played on the Play tap so iOS/Android treat the
// <audio> element as user-started; the real track is swapped in when ready.
const SILENCE = (() => {
  const n = 4000, b = new DataView(new ArrayBuffer(44 + n));
  const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true);
  b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, 8000, true);
  b.setUint32(28, 8000, true); b.setUint16(32, 1, true); b.setUint16(34, 8, true);
  w(36, "data"); b.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
})();

async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => createImageBitmap(file));
  const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85);
  return { url, b64: url.split(",")[1] };
}

function invalidate() {
  version++; prep = null; answers = null; clearTimeout(timer);
  if (audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = null;
  tracks.forEach((u) => URL.revokeObjectURL(u));
  tracks = []; total = 0;
  $("list").innerHTML = "";
  if (playing) stop();
  playBtn.disabled = !images.length;
  if (!images.length) return say("Add photos, then press Play.");
  // Start working right away so Play is instant; a short delay batches photos added back to back.
  say("Reading questions…");
  timer = setTimeout(() => ensure().catch((e) => say(e.message || "Something went wrong", true)), 700);
}

function renderThumbs() {
  $("thumbs").innerHTML = "";
  images.forEach((im, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    const img = new Image(); img.src = im.url; img.alt = "Photo " + (i + 1);
    const x = document.createElement("button"); x.textContent = "✕"; x.setAttribute("aria-label", "Remove photo");
    x.onclick = () => { images.splice(i, 1); renderThumbs(); invalidate(); };
    d.append(img, x); $("thumbs").append(d);
  });
}

$("file").onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = "";
  try { for (const f of files) images.push(await shrink(f)); }
  catch { say("Could not read that image.", true); }
  renderThumbs(); invalidate();
};

// Built for patchy mobile data and school Wi-Fi: every request has a time limit, the whole
// response is downloaded before it counts as a success, and dropped connections or server
// hiccups are retried twice before giving up.
async function api(path, body) {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let attempt = 1; ; attempt++) {
    const ctl = new AbortController(), limit = setTimeout(() => ctl.abort(), 50000);
    let r, buf;
    try {
      r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-code": localStorage.getItem("code") || "" },
        body: JSON.stringify(body),
        signal: ctl.signal,
      });
      buf = await r.arrayBuffer();
    } catch {
      clearTimeout(limit);
      if (attempt >= 3) throw new Error("Connection problem. Check your signal and press Play again.");
      await sleep(700 * attempt); continue;
    }
    clearTimeout(limit);
    if (r.status === 401) {
      const code = prompt("Access code");
      if (!code) throw new Error("Access code required");
      localStorage.setItem("code", code); attempt--; continue;
    }
    const json = () => JSON.parse(new TextDecoder().decode(buf));
    if (!r.ok) {
      if (r.status >= 500 && attempt < 3) { await sleep(700 * attempt); continue; }
      let message; try { message = json().error; } catch {}
      throw new Error(message || "Request failed (" + r.status + ")");
    }
    const type = r.headers.get("content-type") || "";
    return { json: async () => json(), arrayBuffer: async () => buf, blob: async () => new Blob([buf], { type }) };
  }
}

const script = (a) =>
  a.map((x) => `Question ${x.number} answer is: ${x.answer.replace(/\bp\.t\./gi, "pertaining to")}.`).join("\n\n");

function renderAnswers() {
  $("list").innerHTML = "";
  answers.forEach((x, i) => {
    const li = document.createElement("li");
    const s = document.createElement("small"); s.textContent = `${x.number}. ${x.question}`;
    const b = document.createElement("b"); b.textContent = x.answer;
    li.append(s, b); $("list").append(li);
  });
}

// --- Voice -----------------------------------------------------------------------------
// The voice is generated a few answers at a time. Each piece becomes a playable
// track as soon as it arrives, so the first answers can start within a few seconds while
// the rest are still being made. When every piece is in, they are joined into one file
// (audioUrl) and playback settles into looping that single file.
let tracks = [], total = 0;   // per-piece blob URLs, and how many pieces there will be
let pos = 0, full = false, waiting = false;

function wavBlob(header, bodies) {
  const size = bodies.reduce((n, b) => n + b.length, 0);
  const head = header.slice(0, 44), view = new DataView(head.buffer);
  view.setUint32(4, 36 + size, true); view.setUint32(40, size, true);
  return new Blob([head, ...bodies], { type: "audio/wav" });
}

// Resolves once the first piece is playable; the remaining pieces keep arriving after that.
function voice(list, mine) {
  // The first pieces are short so speech starts quickly; each later piece is finished
  // well before the one ahead of it has played through.
  const groups = [];
  for (let i = 0, n = 2; i < list.length; i += n, n = groups.length === 1 ? 3 : 5)
    groups.push(script(list.slice(i, i + n)));
  // A spoken closing line marks the loop point and means that if the voice clips the tail
  // of its text, it clips this line rather than the last answer.
  const END = "\n\nEnd of answers.";
  groups[groups.length - 1] += END;
  // One second of silence so the loop restart never cuts into speech.
  const pad = new Uint8Array(44100);
  tracks = []; total = groups.length;

  return new Promise((ready, fail) => {
    (async () => {
      const wavs = [];
      let nextUp = 0, failed = false;
      // Three requests at a time, handed out in order so the earliest pieces come back first.
      const worker = async () => {
        while (!failed && nextUp < groups.length) {
          const i = nextUp++;
          const w = new Uint8Array(await (await api("/api/tts", { text: groups[i], gap: GAP * RATE })).arrayBuffer());
          if (failed || mine !== version) return;
          wavs[i] = i === groups.length - 1 ? [w, w.subarray(44), pad] : [w, w.subarray(44)];
          tracks[i] = URL.createObjectURL(wavBlob(w, wavs[i].slice(1)));
          if (i === 0) ready(true);
          resume();
        }
      };
      try {
        await Promise.all([worker(), worker(), worker()]);
        if (mine !== version) return ready(false);
        audioUrl = URL.createObjectURL(wavBlob(wavs[0][0], wavs.flatMap((w) => w.slice(1))));
        if (playing) say(`All ${list.length} answers loaded. Looping; no connection needed from here.`);
        resume();
      } catch {
        failed = true;
        // If any piece fails, redo the whole set with the backup voice so the loop is complete.
        try {
          const r = await api("/api/tts", { text: script(list) + END, engine: "basic" });
          const blob = await r.blob();
          if (mine !== version) return ready(false);
          tracks.forEach((u) => URL.revokeObjectURL(u));
          tracks = []; total = 0;
          audioUrl = URL.createObjectURL(blob);
          ready(true); resume();
        } catch (e) { fail(e); }
      }
    })();
  });
}

function ensure() {
  clearTimeout(timer);
  if (!prep || prep.v !== version) {
    const p = { v: version };
    p.promise = prepare(version).catch((e) => { if (prep === p) prep = null; throw e; });
    prep = p;
  }
  return prep.promise;
}

async function prepare(mine) {
  if (!answers) {
    say("Reading questions…");
    const r = await api("/api/solve", { images: images.map((i) => i.b64) });
    const data = await r.json();
    if (mine !== version) return false;
    if (!data.answers?.length) throw new Error("No questions found in the photos");
    answers = data.answers; renderAnswers();
  }
  if (!audioUrl && !tracks[0]) {
    say("Generating voice…");
    if (!(await voice(answers, mine))) return false;
  }
  if (!playing) say(`${answers.length} answers ready. Press Play.`);
  return true;
}

// --- Playback --------------------------------------------------------------------------
function setPlaying(on) {
  playing = on;
  playBtn.textContent = on ? "■ Stop" : "▶ Play";
  playBtn.classList.toggle("on", on);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused";
}

function playUrl(url, loop) {
  audio.loop = loop; audio.src = url;
  audio.playbackRate = RATE;
  return audio.play().catch(() => {});
}

// Plays whatever comes next: the following piece, the joined loop once the first pass is
// done, or silence (which keeps the audio session alive) while a piece is still on its way.
function next() {
  if (!playing) return;
  if (audioUrl && pos >= total) { full = true; waiting = false; return playUrl(audioUrl, true); }
  if (tracks[pos]) { waiting = false; return playUrl(tracks[pos++], false); }
  waiting = true; playUrl(SILENCE, true);
}
function resume() { if (playing && waiting) next(); }

function stop() {
  audio.pause(); setPlaying(false);
  if (answers && (audioUrl || tracks[0])) say(`${answers.length} answers ready. Press Play.`);
}

async function start() {
  setPlaying(true);
  full = false; waiting = true;
  pos = audioUrl ? total : 0;
  playUrl(SILENCE, true);
  try {
    const v = version;
    if (!(await ensure()) || !playing || v !== version) return;
    resume();
    say(audioUrl
      ? `All ${answers.length} answers loaded. Looping; no connection needed from here.`
      : `Playing. Still loading the rest of ${answers.length} answers…`);
    if ("mediaSession" in navigator)
      navigator.mediaSession.metadata = new MediaMetadata({ title: `${answers.length} answers`, artist: "Recito" });
  } catch (e) {
    audio.pause(); setPlaying(false); say(e.message || "Something went wrong", true);
  }
}

playBtn.onclick = () => (playing ? stop() : start());
// Wake the voice server as the page opens so the first real request does not pay for its start-up.
fetch("/api/tts", {
  method: "POST",
  headers: { "Content-Type": "application/json", "x-code": localStorage.getItem("code") || "" },
  body: JSON.stringify({ text: "Ready." }),
}).catch(() => {});
audio.addEventListener("ended", () => {
  if (!playing) return;
  // On the joined file this is only a safety net in case a browser ignores the loop flag.
  if (full) { audio.currentTime = 0; audio.play().catch(() => {}); }
  else next();
});
// Setting src resets playbackRate on some browsers.
audio.addEventListener("loadedmetadata", () => { audio.playbackRate = RATE; });
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => { if (audioUrl || tracks[0]) { audio.play(); setPlaying(true); } });
  navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); setPlaying(false); });
}
</script>
</body>
</html>
