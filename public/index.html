<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Recito</title>
<style>
  :root { --bg:#0e1014; --card:#181b22; --line:#272b35; --text:#eef0f4; --dim:#8b91a0; --accent:#7ce0b0; --danger:#ff7a7a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
         padding:max(16px,env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom)); max-width:640px; margin-inline:auto; }
  h1 { font-size:18px; margin:4px 0 14px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .drop { display:flex; align-items:center; justify-content:center; gap:10px; min-height:84px; border:1.5px dashed var(--line);
          border-radius:16px; background:var(--card); color:var(--dim); font-weight:600; cursor:pointer; }
  .drop:active { border-color:var(--accent); color:var(--text); }
  input[type=file] { display:none; }
  #thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .thumb { position:relative; width:76px; height:76px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button { position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%; border:0; background:#000a; color:#fff; font-size:14px; line-height:1; }
  #status { margin:14px 2px 6px; color:var(--dim); font-size:14px; min-height:20px; }
  #status.err { color:var(--danger); }
  ol { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  li small { display:block; color:var(--dim); font-size:12.5px; }
  li b { color:var(--accent); font-weight:600; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
         background:linear-gradient(transparent,var(--bg) 28%); display:flex; gap:10px; align-items:center; justify-content:center; }
  #play { flex:1; max-width:608px; height:64px; border:0; border-radius:20px; background:var(--accent); color:#06281a; font-size:19px; font-weight:700; }
  #play.on { background:var(--danger); color:#2b0606; }
  #play:disabled { opacity:.4; }
  select { height:64px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; padding:0 10px; }
</style>
</head>
<body>
<h1>Reci<span>to</span></h1>

<label class="drop" for="file">＋ Add question photos</label>
<input id="file" type="file" accept="image/*" multiple>
<div id="thumbs"></div>
<div id="status">Add photos, then press Play.</div>
<ol id="list"></ol>

<div class="bar">
  <button id="play" disabled>▶ Play</button>
  <select id="rate" aria-label="Speed">
    <option value="0.85">0.85×</option><option value="1" selected>1×</option>
    <option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option>
  </select>
</div>
<audio id="audio" playsinline preload="auto"></audio>

<script>
const $ = (id) => document.getElementById(id);
const audio = $("audio"), playBtn = $("play"), statusEl = $("status");
let images = [];          // [{b64, url}]
let answers = null;       // solved answers for current images
let audioUrl = null;      // looping mp3 for current answers
let playing = false, version = 0, prep = null, timer = 0;

const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? "err" : ""; };

// Half a second of silence. Played on the Play tap so iOS/Android treat the
// <audio> element as user-started; the real track is swapped in when ready.
const SILENCE = (() => {
  const n = 4000, b = new DataView(new ArrayBuffer(44 + n));
  const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true);
  b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, 8000, true);
  b.setUint32(28, 8000, true); b.setUint16(32, 1, true); b.setUint16(34, 8, true);
  w(36, "data"); b.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
})();

async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => createImageBitmap(file));
  const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85);
  return { url, b64: url.split(",")[1] };
}

function invalidate() {
  version++; prep = null; answers = null; clearTimeout(timer);
  if (audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = null;
  $("list").innerHTML = "";
  if (playing) stop();
  playBtn.disabled = !images.length;
  if (!images.length) return say("Add photos, then press Play.");
  // Start working right away so Play is instant; a short delay batches photos added back to back.
  say("Reading questions…");
  timer = setTimeout(() => ensure().catch((e) => say(e.message || "Something went wrong", true)), 700);
}

function renderThumbs() {
  $("thumbs").innerHTML = "";
  images.forEach((im, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    const img = new Image(); img.src = im.url; img.alt = "Photo " + (i + 1);
    const x = document.createElement("button"); x.textContent = "✕"; x.setAttribute("aria-label", "Remove photo");
    x.onclick = () => { images.splice(i, 1); renderThumbs(); invalidate(); };
    d.append(img, x); $("thumbs").append(d);
  });
}

$("file").onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = "";
  try { for (const f of files) images.push(await shrink(f)); }
  catch { say("Could not read that image.", true); }
  renderThumbs(); invalidate();
};

async function api(path, body) {
  for (;;) {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-code": localStorage.getItem("code") || "" },
      body: JSON.stringify(body),
    });
    if (r.status === 401) {
      const code = prompt("Access code");
      if (!code) throw new Error("Access code required");
      localStorage.setItem("code", code); continue;
    }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Request failed (" + r.status + ")");
    return r;
  }
}

const script = (a) =>
  a.map((x, i) => `Question ${i + 1} answer is: ${x.answer.replace(/\bp\.t\./gi, "pertaining to")}.`).join("\n\n");

function renderAnswers() {
  $("list").innerHTML = "";
  answers.forEach((x, i) => {
    const li = document.createElement("li");
    const s = document.createElement("small"); s.textContent = `${i + 1}. ${x.question}`;
    const b = document.createElement("b"); b.textContent = x.answer;
    li.append(s, b); $("list").append(li);
  });
}

function ensure() {
  clearTimeout(timer);
  if (!prep || prep.v !== version) {
    const p = { v: version };
    p.promise = prepare(version).catch((e) => { if (prep === p) prep = null; throw e; });
    prep = p;
  }
  return prep.promise;
}

async function prepare(mine) {
  if (!answers) {
    say("Reading questions…");
    const r = await api("/api/solve", { images: images.map((i) => i.b64) });
    const data = await r.json();
    if (mine !== version) return false;
    if (!data.answers?.length) throw new Error("No questions found in the photos");
    answers = data.answers; renderAnswers();
  }
  if (!audioUrl) {
    say("Generating voice…");
    const r = await api("/api/tts", { text: script(answers) });
    const blob = await r.blob();
    if (mine !== version) return false;
    audioUrl = URL.createObjectURL(blob);
  }
  if (!playing) say(`${answers.length} answers ready. Press Play.`);
  return true;
}

function setPlaying(on) {
  playing = on;
  playBtn.textContent = on ? "■ Stop" : "▶ Play";
  playBtn.classList.toggle("on", on);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused";
}

function stop() {
  audio.pause(); setPlaying(false);
  if (audioUrl) say(`${answers.length} answers ready. Press Play.`);
}

async function start() {
  setPlaying(true);
  audio.loop = true;
  if (!audioUrl) { audio.src = SILENCE; audio.play().catch(() => {}); }
  try {
    const v = version;
    if (!(await ensure()) || !playing || v !== version) return;
    audio.src = audioUrl;
    audio.playbackRate = +$("rate").value;
    await audio.play();
    say(`Looping ${answers.length} answers. Keeps playing with the screen locked.`);
    if ("mediaSession" in navigator)
      navigator.mediaSession.metadata = new MediaMetadata({ title: `${answers.length} answers`, artist: "Recito" });
  } catch (e) {
    audio.pause(); setPlaying(false); say(e.message || "Something went wrong", true);
  }
}

playBtn.onclick = () => (playing ? stop() : start());
$("rate").onchange = () => { audio.playbackRate = +$("rate").value; };
// Setting src resets playbackRate on some browsers.
audio.addEventListener("loadedmetadata", () => { audio.playbackRate = +$("rate").value; });
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => { if (audioUrl) { audio.play(); setPlaying(true); } });
  navigator.mediaSession.setActionHandler("pause", () => { audio.pause(); setPlaying(false); });
}
</script>
</body>
</html>
